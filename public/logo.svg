<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 292" width="512" height="512">
  <defs>
    <filter id="a-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer frame matching BoardSvg -->
  <rect x="0" y="0" width="292" height="292" rx="34" fill="#202326" />
  <rect x="8" y="8" width="276" height="276" rx="26" fill="#334155" stroke="#1E293B" stroke-width="4" />

  <!-- Exit notch & arrow on row 2 -->
  <rect x="278" y="105" width="14" height="38" fill="#334155" />
  <polygon points="280,116 289.5,124 280,132" fill="#EF4444" />

  <!-- Real 6x6 board + vehicles (Classic Card #1 layout, slightly dimmed so the orange A pops) -->
  <g transform="translate(14, 14)" opacity="0.88">
    <!-- 6x6 tiles -->
    <g fill="#CBD5E1" fill-opacity="0.22">
      <rect x="2" y="2" width="40" height="40" rx="5"/><rect x="46" y="2" width="40" height="40" rx="5"/><rect x="90" y="2" width="40" height="40" rx="5"/><rect x="134" y="2" width="40" height="40" rx="5"/><rect x="178" y="2" width="40" height="40" rx="5"/><rect x="222" y="2" width="40" height="40" rx="5"/>
      <rect x="2" y="46" width="40" height="40" rx="5"/><rect x="46" y="46" width="40" height="40" rx="5"/><rect x="90" y="46" width="40" height="40" rx="5"/><rect x="134" y="46" width="40" height="40" rx="5"/><rect x="178" y="46" width="40" height="40" rx="5"/><rect x="222" y="46" width="40" height="40" rx="5"/>
      <rect x="2" y="90" width="40" height="40" rx="5" fill-opacity="0.34"/><rect x="46" y="90" width="40" height="40" rx="5" fill-opacity="0.34"/><rect x="90" y="90" width="40" height="40" rx="5" fill-opacity="0.34"/><rect x="134" y="90" width="40" height="40" rx="5" fill-opacity="0.34"/><rect x="178" y="90" width="40" height="40" rx="5" fill-opacity="0.34"/><rect x="222" y="90" width="40" height="40" rx="5" fill-opacity="0.34"/>
      <rect x="2" y="134" width="40" height="40" rx="5"/><rect x="46" y="134" width="40" height="40" rx="5"/><rect x="90" y="134" width="40" height="40" rx="5"/><rect x="134" y="134" width="40" height="40" rx="5"/><rect x="178" y="134" width="40" height="40" rx="5"/><rect x="222" y="134" width="40" height="40" rx="5"/>
      <rect x="2" y="178" width="40" height="40" rx="5"/><rect x="46" y="178" width="40" height="40" rx="5"/><rect x="90" y="178" width="40" height="40" rx="5"/><rect x="134" y="178" width="40" height="40" rx="5"/><rect x="178" y="178" width="40" height="40" rx="5"/><rect x="222" y="178" width="40" height="40" rx="5"/>
      <rect x="2" y="222" width="40" height="40" rx="5"/><rect x="46" y="222" width="40" height="40" rx="5"/><rect x="90" y="222" width="40" height="40" rx="5"/><rect x="134" y="222" width="40" height="40" rx="5"/><rect x="178" y="222" width="40" height="40" rx="5"/><rect x="222" y="222" width="40" height="40" rx="5"/>
    </g>

    <!-- Light Green Car A (row 0, col 0-1 H) -->
    <g transform="translate(3.5, 3.5)">
      <rect width="81" height="37" rx="9" fill="#7AC943" stroke="#5EA82C" stroke-width="2"/>
      <rect x="12" y="6" width="11" height="25" rx="3" fill="#1E293B"/>
      <rect x="49" y="5" width="13" height="27" rx="3" fill="#1E293B"/>
      <rect x="22" y="5" width="29" height="27" rx="4" fill="#5EA82C"/>
    </g>

    <!-- Yellow Truck O (row 0-2, col 5 V) -->
    <g transform="translate(223.5, 3.5)">
      <rect width="37" height="86" rx="5" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
      <rect x="2" y="90" width="33" height="35" rx="7" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
      <rect x="5" y="104" width="27" height="14" rx="3" fill="#1E293B"/>
    </g>

    <!-- Purple Truck P (row 1-3, col 0 V) -->
    <g transform="translate(3.5, 47.5)">
      <rect width="37" height="86" rx="5" fill="#9333EA" stroke="#6B21A8" stroke-width="2"/>
      <rect x="2" y="90" width="33" height="35" rx="7" fill="#9333EA" stroke="#6B21A8" stroke-width="2"/>
      <rect x="5" y="104" width="27" height="14" rx="3" fill="#1E293B"/>
    </g>

    <!-- Blue Truck Q (row 1-3, col 3 V) -->
    <g transform="translate(135.5, 47.5)">
      <rect width="37" height="86" rx="5" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
      <rect x="2" y="90" width="33" height="35" rx="7" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
      <rect x="5" y="104" width="27" height="14" rx="3" fill="#0F172A"/>
    </g>

    <!-- Red Hero Car X (row 2, col 1-2 H) -->
    <g transform="translate(47.5, 91.5)">
      <rect width="81" height="37" rx="9" fill="#E11D2E" stroke="#B91C1C" stroke-width="2"/>
      <rect x="12" y="6" width="11" height="25" rx="3" fill="#1E293B"/>
      <rect x="49" y="5" width="13" height="27" rx="3" fill="#1E293B"/>
      <rect x="22" y="5" width="29" height="27" rx="4" fill="#B91C1C"/>
    </g>

    <!-- Pink Car D (row 4-5, col 0 V) -->
    <g transform="translate(3.5, 179.5)">
      <rect width="37" height="81" rx="9" fill="#F472B6" stroke="#DB2777" stroke-width="2"/>
      <rect x="6" y="12" width="25" height="11" rx="3" fill="#1E293B"/>
      <rect x="5" y="49" width="27" height="13" rx="3" fill="#1E293B"/>
      <rect x="5" y="22" width="27" height="29" rx="4" fill="#DB2777"/>
    </g>

    <!-- Light Blue Car C (row 4, col 4-5 H) -->
    <g transform="translate(179.5, 179.5)">
      <rect width="81" height="37" rx="9" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
      <rect x="12" y="6" width="11" height="25" rx="3" fill="#0F172A"/>
      <rect x="49" y="5" width="13" height="27" rx="3" fill="#0F172A"/>
      <rect x="22" y="5" width="29" height="27" rx="4" fill="#0284C7"/>
    </g>

    <!-- Teal Truck R (row 5, col 2-4 H) -->
    <g transform="translate(91.5, 223.5)">
      <rect width="86" height="37" rx="5" fill="#0D9488" stroke="#115E59" stroke-width="2"/>
      <rect x="90" y="2" width="35" height="33" rx="7" fill="#0D9488" stroke="#115E59" stroke-width="2"/>
      <rect x="104" y="5" width="14" height="27" rx="3" fill="#0F172A"/>
    </g>
  </g>

  <!-- Subtle dark vignette to frame the foreground A -->
  <rect x="8" y="8" width="276" height="276" rx="26" fill="#0F172A" fill-opacity="0.28" />

  <!-- Superimposed exact orange 'A' monogram with dark contrast halo -->
  <g filter="url(#a-shadow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 74 224 L 145 64 L 222 224" stroke="#181B1F" stroke-width="40" />
    <path d="M 70 144 L 222 224" stroke="#181B1F" stroke-width="40" />
    <path d="M 74 224 L 145 64 L 222 224" stroke="#F06400" stroke-width="24" />
    <path d="M 70 144 L 222 224" stroke="#F06400" stroke-width="24" />
  </g>
</svg>
